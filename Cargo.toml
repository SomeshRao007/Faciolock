[workspace]
resolver = "3"
members = [
    "crates/faciolock-camera",
    "crates/faciolock-cli",
    "crates/faciolock-daemon",
    "crates/faciolock-ipc",
    "crates/faciolock-pam",
    "crates/faciolock-vision",
]

# The spikes are throwaway, and keeping them out of the workspace
# keeps their dependency trees out of the real crates'. CI asserts that
# `cargo tree -p faciolock-pam` contains only libc and faciolock-ipc; that assertion
# is worth nothing if a spike can drag something into the lockfile.
#
# `fuzz/` is excluded for the same reason and one sharper one: `libfuzzer-sys` drags in
# `arbitrary`, `cc` and a bundled compiler runtime, and the thing it fuzzes hardest is the
# response parser inside `pam_faciolock.so`. A fuzzer that widened the dependency tree of the
# crate it exists to harden would be self-defeating.
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
tract-onnx = "0.23.4"

# Capture. Chosen over hand-rolled ioctls for one reason: it gets the
# kernel struct layouts right on every architecture Debian builds for, and armhf/arm64/
# riscv64 cannot be tested here. Three defects are worked around at every call site --
# see `faciolock-camera`'s crate docs.
v4l = "0.14"

# Daemon-only. Both are already in the Ubuntu archive at current versions, so unlike the
# capture crates these cost nothing on the upstreaming path. They must never appear
# in faciolock-vision, whose single-dependency story is a security claim, nor in
# faciolock-pam, whose dependency tree CI asserts is libc + faciolock-ipc.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha2 = "0.10"
libc = "0.2"

# Template encryption. Daemon-only, for the same reason as the two above.
#
# Archive parity is the whole reason this crate and not another: `librust-chacha20poly1305-dev`
# is packaged at 0.10.1, so the version here is the version Debian already ships. Pure Rust,
# so it adds no native dependency, which is what choosing `tract` over `ort` bought.
#
# `default-features = false` drops the `getrandom` dependency: the daemon already links
# `libc` and calls the syscall directly, which is one crate fewer in a tree a distro security
# reviewer reads.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

faciolock-camera = { path = "crates/faciolock-camera" }
faciolock-cli = { path = "crates/faciolock-cli" }
faciolock-ipc = { path = "crates/faciolock-ipc" }
faciolock-pam = { path = "crates/faciolock-pam" }
faciolock-vision = { path = "crates/faciolock-vision" }

[profile.release]
debug = true
