# The daemon's own user (wiki/03 R7). A system user with no shell and no password.
#
# The `m` line is the daemon's one privilege: /dev/video2 is root:video 0660, so membership
# of `video` is what lets it open the camera without being root. Doing it here rather than in
# a maintainer script means the membership is declared once, in a file a reviewer can read,
# and re-applied idempotently on every upgrade.
u faciolock - "Faciolock face authentication" /var/lib/faciolock -
m faciolock video

# Who may ask the daemon about themselves (P6-d). The socket is 0660 root:faciolock-auth, so
# membership is the whole gate at connect() — and `serve::may_ask` is the gate behind it,
# because a group cannot express "about yourself only" and the kernel's SO_PEERCRED can.
#
# Empty on install. A human joins it when they enable face unlock, not when the package lands.
g faciolock-auth -
