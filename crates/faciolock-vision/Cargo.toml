[package]
name = "faciolock-vision"
version.workspace = true
edition.workspace = true
publish.workspace = true

# `tract` is the only dependency, chosen over `ort` deliberately: the built binary
# links libc, libm and libgcc_s and nothing else. Anything added here
# lands in the daemon that parses V4L2 buffers, so it needs the same justification.
[dependencies]
tract-onnx = { workspace = true }
