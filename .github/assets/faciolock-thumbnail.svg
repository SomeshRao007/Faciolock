<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Faciolock — Infrared face authentication for Linux</title>
  <defs>
    <radialGradient id="bg" cx="360" cy="320" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151922"/>
      <stop offset="1" stop-color="#090b0f"/>
    </radialGradient>
    <radialGradient id="halo" cx="-40" cy="-10" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3355" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#ff3355" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ff3355" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="-30" cy="-20" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dfe4ea" stop-opacity=".22"/>
      <stop offset="1" stop-color="#dfe4ea" stop-opacity=".03"/>
    </radialGradient>
    <linearGradient id="seam" x1="0" y1="-250" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3355" stop-opacity="0"/>
      <stop offset=".2" stop-color="#ff3355"/>
      <stop offset=".8" stop-color="#ff3355"/>
      <stop offset="1" stop-color="#ff3355" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="lit"><rect x="-400" y="-400" width="400" height="800"/></clipPath>
    <clipPath id="dark"><rect x="0" y="-400" width="400" height="800"/></clipPath>

    <path id="head" d="M0 -155C66 -155 112 -112 112 -40C112 20 104 66 80 102C58 134 30 152 0 152C-30 152 -58 134 -80 102C-104 66 -112 20 -112 -40C-112 -112 -66 -155 0 -155Z"/>
    <g id="lines" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use xlink:href="#head"/>
      <path d="M-112 -40C-128 -46 -134 -20 -128 0C-124 14 -116 18 -110 16M112 -40C128 -46 134 -20 128 0C124 14 116 18 110 16"/>
      <path d="M-74 -52Q-50 -66 -22 -55M74 -52Q50 -66 22 -55"/>
      <path d="M-66 -24Q-45 -40 -24 -24Q-45 -12 -66 -24ZM66 -24Q45 -40 24 -24Q45 -12 66 -24Z"/>
      <path d="M-8 -14C-10 8 -22 26 -18 38C-15 46 -6 46 0 44M8 -14C10 8 22 26 18 38C15 46 6 46 0 44"/>
      <path d="M-40 84Q0 96 40 84"/>
      <path d="M-165 -167V-205H-127M165 -167V-205H127M-165 167V205H-127" stroke-width="4"/>
    </g>
    <path id="mesh" d="M-45 -24L45 -24L0 38ZM-45 -24L-40 84L0 38L40 84L45 -24M-40 84L40 84"/>
    <g id="marks">
      <circle cx="-45" cy="-24" r="5.5"/><circle cx="45" cy="-24" r="5.5"/>
      <circle cx="-40" cy="84" r="5.5"/><circle cx="40" cy="84" r="5.5"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g transform="translate(360 320)">
    <!-- emitter ON frame -->
    <g clip-path="url(#lit)">
      <circle r="300" fill="url(#halo)"/>
      <use xlink:href="#head" fill="url(#skin)"/>
      <use xlink:href="#mesh" fill="none" stroke="#ff3355" stroke-opacity=".45" stroke-width="1.2"/>
      <use xlink:href="#lines" stroke="#e9edf2" stroke-width="3.2" filter="url(#glow)"/>
      <use xlink:href="#marks" fill="#ffffff" stroke="#ff3355" stroke-width="2.5" filter="url(#glow)"/>
    </g>
    <!-- emitter OFF frame -->
    <g clip-path="url(#dark)">
      <use xlink:href="#lines" stroke="#2a2f38" stroke-width="3"/>
      <use xlink:href="#marks" fill="none" stroke="#2a2f38" stroke-width="2"/>
    </g>
    <!-- ON − OFF difference -->
    <line y1="-250" y2="250" stroke="url(#seam)" stroke-width="10" filter="url(#blur8)" opacity=".8"/>
    <line y1="-250" y2="250" stroke="url(#seam)" stroke-width="2.5"/>
    <circle cy="38" r="5.5" fill="#ffffff" stroke="#ff3355" stroke-width="2.5" filter="url(#glow)"/>
    <!-- verdict -->
    <g transform="translate(165 205)">
      <circle r="29" fill="#34d399"/>
      <g fill="none" stroke="#06231a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-11" y="-3" width="22" height="17" rx="3.5"/>
        <path d="M-6 -3V-9A6.5 6.5 0 0 1 6.6 -11.2"/>
      </g>
    </g>
  </g>

